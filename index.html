<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Solar System</title>
    <link rel="stylesheet" href="1style.css">
    <link rel="stylesheet" href="2style.css">
    <link rel="stylesheet" href="3style.css">
    <link rel="stylesheet" href="4style.css">
    <link rel="stylesheet" href="5style.css">
</head>
<body>

    <!-- Stars -->
    <div id="stars"></div>

    <!-- Nebula -->
    <div class="nebula"></div>

    <!-- Milky Way -->
    <div class="milkyway"></div>

    <!-- Solar System -->
    <div class="solar-system">

        <!-- Sun -->
        <div class="sun"></div>

        <!-- Mercury -->
        <div class="orbit mercury-orbit">
            <div class="planet mercury"></div>
        </div>

        <!-- Venus -->
        <div class="orbit venus-orbit">
            <div class="planet venus"></div>
        </div>

        <!-- Earth -->
        <div class="orbit earth-orbit">
            <div class="planet earth">

                <!-- Moon -->
                <div class="moon-orbit">
                    <div class="moon"></div>
                </div>

            </div>
        </div>

        <!-- Mars -->
        <div class="orbit mars-orbit">
            <div class="planet mars"></div>
        </div>

        <!-- Asteroid Belt -->
        <div class="asteroid-belt"></div>

        <!-- Jupiter -->
        <div class="orbit jupiter-orbit">
            <div class="planet jupiter"></div>
        </div>

        <!-- Saturn -->
        <div class="orbit saturn-orbit">
            <div class="planet saturn">
                <div class="ring"></div>
            </div>
        </div>

        <!-- Uranus -->
        <div class="orbit uranus-orbit">
            <div class="planet uranus"></div>
        </div>

        <!-- Neptune -->
        <div class="orbit neptune-orbit">
            <div class="planet neptune"></div>
        </div>

    </div>

    <!-- Information Panel -->
    <div class="info">
        <h2>🌌 Solar System</h2>
        <p>☀ Sun at the center</p>
        <p>🪐 8 Planets Orbiting</p>
        <p>🌍 Earth with Moon</p>
        <p>☄ Asteroid Belt</p>
        <p>✨ Shooting Stars</p>
    </div>

    <script src="1script.js"></script>
    <script src="2script.js"></script>
    <script src="3script.js"></script>
    <script src="4script.js"></script>
    <script src="5script.js"></script>
    <script src="6script.js"></script>
    <script src="7script.js"></script>

</body>
</html>
